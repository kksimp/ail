[package]
name = "ail-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "AIL bootstrap front end and reference interpreter (ADR 0023, ADR 0032)"

[[bin]]
name = "ail"
path = "src/main.rs"

# Every crate needs a stated justification (ADR 0023). The two below are
# temporary scaffolding for `std.ui` only (ADR 0177): a window with a
# framebuffer and keyboard on macOS, Linux and Windows, and a monospace
# bitmap font. Linux loads X11 at run time, so a headless build and
# `./ail selftest` need no display libraries.
[dependencies]
minifb = { version = "=0.28.0", default-features = false, features = ["x11"] }
embedded-graphics = { version = "=0.8.1", default-features = false }
